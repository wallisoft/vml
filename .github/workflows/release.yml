name: Release

# Push a tag like v0.16.0 and this compiles Visualised (VML) to native code with Nuitka, builds the Windows installer,
# a portable Windows zip, the Linux package and (once the Store identity is set) the Microsoft Store MSIX,
# then publishes them to the PUBLIC repo wallisoft/vml-releases. The source stays in this private repo.
#
# Needs:  secret RELEASES_TOKEN   (fine-grained token: vml-releases, Contents read/write)
# Store:  variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY (Partner Center > Product identity)
#         and optionally MSIX_DISPLAY_NAME (default "Visualised"). Without them, the MSIX step is skipped.

on:
  push:
    tags: ["v*.*.0"]          # major and minor only: patches are built locally (tools/build-local.sh)

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Tag must match __version__ in vml/__init__.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(grep -m1 '__version__' vml/__init__.py | cut -d'"' -f2)
          echo "tag=$TAG code=$CODE"
          [ "$TAG" = "$CODE" ] || { echo "::error::Tag v$TAG doesn't match __version__ $CODE"; exit 1; }
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/build-requirements.txt paramiko wsgidav cheroot
          python -m pip install winfspy
          if ($LASTEXITCODE -ne 0) { "winfspy didn't install: SSH drives will use WebDAV only in this build"; $global:LASTEXITCODE = 0 }
          choco install innosetup -y --no-progress
      - name: Compile with Nuitka
        shell: pwsh
        run: |
          $winfsp = @()
          python -c "import winfspy" 2>$null; if ($LASTEXITCODE -eq 0) { $winfsp = @("--include-package=winfspy") }
          $global:LASTEXITCODE = 0
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 `
            --windows-console-mode=attach --windows-icon-from-ico=packaging/art/vml.ico `
            --include-package=vml --include-package=lupa `
            --include-package=paramiko --include-package=wsgidav --include-package-data=wsgidav --include-package=cheroot @winfsp `
            --include-data-dir=designer=designer --include-data-dir=vml/lua=lua --include-data-dir=vml/web=web `
            --include-data-dir=csharp=csharp `
            --company-name=Wallisoft --product-name=Visualised `
            --file-version=${{ needs.check.outputs.version }} --product-version=${{ needs.check.outputs.version }} `
            --output-filename=vml.exe --output-dir=build vml.py
      - name: Smoke test the compiled program
        shell: pwsh
        run: |
          # a GUI program: Start-Process -Wait so PowerShell waits for it, with its output captured
          $env:QT_QPA_PLATFORM = "offscreen"
          Start-Process build\vml.dist\vml.exe -ArgumentList "parse", "tests\step1.vml" -Wait -NoNewWindow -RedirectStandardOutput parse.txt
          if (-not (Select-String -Path parse.txt -Pattern "INSERT INTO ui_tree" -Quiet)) { Get-Content parse.txt; throw "parse failed" }
          Start-Process build\vml.dist\vml.exe -ArgumentList "tests\step1.vml", "--shot", "shot.png" -Wait -NoNewWindow -RedirectStandardError form.log
          if (-not (Test-Path shot.png)) { Get-Content form.log; throw "the compiled program didn't open a form" }
          "the compiled program opens a form"
          # the designer itself, and a form that runs a script as it opens: what people actually start
          Start-Process build\vml.dist\vml.exe -ArgumentList "--shot", "designer.png" -Wait -NoNewWindow -RedirectStandardError designer.log
          if (-not (Test-Path designer.png)) { Get-Content designer.log; throw "the compiled program didn't open the designer" }
          Start-Process build\vml.dist\vml.exe -ArgumentList "build\vml.dist\designer\databases.vml", "--shot", "script.png" -Wait -NoNewWindow -RedirectStandardError script.log
          if (-not (Test-Path script.png)) { Get-Content script.log; throw "the compiled program didn't open a form that runs a script" }
          "the compiled program opens the designer, and a form that runs a script"
          # an exported app: the program renamed SmokeApp.exe, beside SmokeApp.vml, must run that form by itself
          Copy-Item -Recurse build\vml.dist app
          Rename-Item app\vml.exe SmokeApp.exe
          Copy-Item tests\step1.vml app\SmokeApp.vml
          $env:VML_DEBUG = "1"
          Start-Process app\SmokeApp.exe -ArgumentList "--shot", "app.png" -Wait -NoNewWindow -RedirectStandardError app.log
          if (-not (Select-String -Path app.log -Pattern "SmokeApp.vml: Parsed" -Quiet)) { Get-Content app.log; throw "an exported app didn't run its own form" }
          "an exported app runs its own form"
          # a project: several forms and a module, run from the project file
          Start-Process build\vml.dist\vml.exe -ArgumentList "tests\project\Demo.vmlproj", "--shot", "proj.png" -Wait -NoNewWindow -RedirectStandardError proj.log
          if (-not (Test-Path proj.png)) { Get-Content proj.log; throw "the compiled program didn't run a project" }
          if (Select-String -Path proj.log -Pattern "module helpers.lua" -Quiet) { Get-Content proj.log; throw "the project's module didn't load" }
          "the compiled program runs a project"
          # the C# host's source must be in the build, for Settings > C# Scripting to build it
          if (-not (Test-Path build\vml.dist\csharp\VmlCSharpHost\VmlCSharpHost.csproj)) { throw "the C# host's source is missing from the build" }
          # the importers are VML files beside the designer, with their shared toolkit
          foreach ($f in "winforms.vml", "vb6.vml", "lib\importkit.lua") { if (-not (Test-Path "build\vml.dist\designer\importers\$f")) { throw "an importer is missing from the build: $f" } }
          # the designer is a project: its project file, forms and modules have to be in the build
          foreach ($f in "Designer.vmlproj", "designer.vml", "databases.vml", "modules\files.lua", "modules\project.lua", "modules\app.lua") { if (-not (Test-Path "build\vml.dist\designer\$f")) { throw "part of the designer is missing from the build: $f" } }
          if (-not (Test-Path "build\vml.dist\web\android-template.apk")) { throw "the Android template is missing from the build (File, Export, Android app needs it)" }
      - name: Build Visualised-Setup.exe
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.check.outputs.version }}" packaging\vml.iss
      - name: Portable zip (also what the designer uses to export Windows apps)
        shell: pwsh
        run: |
          New-Item -ItemType Directory stage | Out-Null
          Copy-Item -Recurse build\vml.dist stage\vml
          Copy-Item packaging\THIRD-PARTY-NOTICES.txt stage\vml\
          Copy-Item LICENSE stage\vml\LICENSE.txt; Copy-Item LICENSE-EXCEPTION.md stage\vml\
          Compress-Archive -Path stage\vml -DestinationPath vml-windows-x64.zip
      - name: Build Visualised.msix (Microsoft Store)
        if: vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          ID: ${{ vars.MSIX_IDENTITY_NAME }}
          PUB: ${{ vars.MSIX_PUBLISHER }}
          PUBDISP: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
          NAME: ${{ vars.MSIX_DISPLAY_NAME || 'Visualised' }}
        run: |
          $p = "${{ needs.check.outputs.version }}".Split('.'); while ($p.Count -lt 3) { $p += '0' }
          $v = "$($p[0]).$($p[1]).$($p[2]).0"
          New-Item -ItemType Directory msix\Assets -Force | Out-Null
          Copy-Item -Recurse build\vml.dist\* msix\
          Copy-Item packaging\THIRD-PARTY-NOTICES.txt msix\
          Copy-Item LICENSE msix\LICENSE.txt; Copy-Item LICENSE-EXCEPTION.md msix\
          python packaging/make_icon.py msix/Assets/Square150x150Logo.png 150
          python packaging/make_icon.py msix/Assets/Square44x44Logo.png 44
          python packaging/make_icon.py msix/Assets/StoreLogo.png 50
          (Get-Content packaging\AppxManifest.xml -Raw).Replace('@IDENTITY_NAME@', $env:ID).Replace('@PUBLISHER@', $env:PUB).Replace('@PUBLISHER_DISPLAY@', $env:PUBDISP).Replace('@DISPLAY_NAME@', $env:NAME).Replace('@VERSION@', $v) | Set-Content msix\AppxManifest.xml -Encoding utf8
          $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $makeappx.FullName pack /d msix /p Visualised.msix /o
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            packaging/Output/Visualised-Setup.exe
            vml-windows-x64.zip
            Visualised.msix
          if-no-files-found: warn

  linux:
    needs: check
    runs-on: ubuntu-22.04        # older base = runs on older and newer distros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf libxcb-cursor0 libgl1 libegl1 libxkbcommon-x11-0 unixodbc fuse3
          python -m pip install --upgrade pip
          python -m pip install -r packaging/build-requirements.txt paramiko mfusepy python-xlib
      - name: Compile with Nuitka
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --enable-plugin=pyside6 \
            --include-package=vml --include-package=lupa \
            --include-package=paramiko --include-module=mfusepy --include-package=Xlib \
            --include-data-dir=designer=designer --include-data-dir=vml/lua=lua --include-data-dir=vml/web=web \
            --include-data-dir=csharp=csharp \
            --output-filename=vml --output-dir=build vml.py
      - name: Package
        run: |
          mv build/vml.dist dist-vml                 # (a folder called "vml" already exists: the source)
          python packaging/make_icon.py dist-vml/vml.png
          cp packaging/THIRD-PARTY-NOTICES.txt dist-vml/
          cp LICENSE dist-vml/LICENSE.txt; cp LICENSE-EXCEPTION.md dist-vml/
          tar czf vml-linux-x86_64.tar.gz --transform 's,^dist-vml,vml,' dist-vml
          cp packaging/install.sh install.sh
      - name: Linux packages (.deb + no-FUSE AppImage)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash tools/bob/linux-package.sh --bundle dist-vml --name visualised --app "Visualised" \
            --version "$VERSION" --exe vml --icon dist-vml/vml.png \
            --categories "Development;" --depends "libxcb-cursor0" \
            --desc "Visualised - design and build cross-platform apps with VML, no coding required" --out pkg
          # stable, version-less names so releases/latest/download links never change
          mv pkg/visualised_*_amd64.deb visualised-amd64.deb
          mv pkg/Visualised-*-x86_64.AppImage Visualised-x86_64.AppImage
          ls -la visualised-amd64.deb Visualised-x86_64.AppImage

      - name: Smoke test the compiled binary
        run: |
          ./dist-vml/vml parse tests/step1.vml | grep -q "INSERT INTO ui_tree"
          QT_QPA_PLATFORM=offscreen timeout 60 ./dist-vml/vml tests/step1.vml --shot shot.png
          test -s shot.png && echo "the compiled binary opens a form"
          # the designer itself, and a form that runs a script as it opens: what people actually start
          QT_QPA_PLATFORM=offscreen timeout 90 ./dist-vml/vml --shot designer.png 2> designer.log || true
          test -s designer.png && echo "the compiled binary opens the designer" || { cat designer.log; exit 1; }
          QT_QPA_PLATFORM=offscreen timeout 90 ./dist-vml/vml dist-vml/designer/databases.vml --shot script.png 2> script.log || true
          test -s script.png && echo "and a form that runs a script" || { cat script.log; exit 1; }
          # an exported app: the binary renamed SmokeApp, beside SmokeApp.vml, must run that form by itself
          cp -r dist-vml app && mv app/vml app/SmokeApp && cp tests/step1.vml app/SmokeApp.vml
          VML_DEBUG=1 QT_QPA_PLATFORM=offscreen timeout 60 ./app/SmokeApp --shot app.png 2> app.log || true
          grep -q "SmokeApp.vml: Parsed" app.log && echo "an exported app runs its own form" || { cat app.log; exit 1; }
          # a project: several forms and a module, run from the project file
          QT_QPA_PLATFORM=offscreen timeout 60 ./dist-vml/vml tests/project/Demo.vmlproj --shot proj.png 2> proj.log || true
          test -s proj.png && ! grep -q "module helpers.lua" proj.log && echo "the compiled binary runs a project" || { cat proj.log; exit 1; }
          # the C# host's source must be in the build, for Settings > C# Scripting to build it
          test -f dist-vml/csharp/VmlCSharpHost/VmlCSharpHost.csproj
          # the importers are VML files beside the designer, with their shared toolkit
          for f in winforms.vml vb6.vml lib/importkit.lua; do test -f "dist-vml/designer/importers/$f"; done
          # the designer is a project: its project file, forms and modules have to be in the build
          for f in Designer.vmlproj designer.vml databases.vml modules/files.lua modules/project.lua modules/app.lua; do test -f "dist-vml/designer/$f"; done
          test -f dist-vml/web/android-template.apk || { echo "the Android template is missing from the build (File, Export, Android app needs it)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            vml-linux-x86_64.tar.gz
            install.sh
            visualised-amd64.deb
            Visualised-x86_64.AppImage

  publish:
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Make sure everything made it
        run: |
          for f in Visualised-Setup.exe vml-windows-x64.zip vml-linux-x86_64.tar.gz install.sh visualised-amd64.deb Visualised-x86_64.AppImage; do
            find . -name "$f" | grep -q . || { echo "::error::$f is missing"; exit 1; }
          done
          find . -name Visualised.msix | grep -q . && echo "Store package included" || echo "no Store package this time (set the MSIX_* variables)"
      - uses: softprops/action-gh-release@v2
        with:
          repository: wallisoft/vml-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Visualised ${{ needs.check.outputs.version }}
          body: |
            **Windows 10 and 11:** download `Visualised-Setup.exe` and run it (no admin needed), or unzip `vml-windows-x64.zip` anywhere.
            **Linux (Ubuntu 22.04+ and similar):** `curl -fsSL https://github.com/wallisoft/vml-releases/releases/latest/download/install.sh | bash`
            &nbsp;&nbsp;&nbsp;&nbsp;or a package: `visualised-amd64.deb` (Debian/Ubuntu/Mint) &middot; `Visualised-x86_64.AppImage` (any distro, no install)
          files: |
            **/Visualised-Setup.exe
            **/vml-windows-x64.zip
            **/vml-linux-x86_64.tar.gz
            **/install.sh
            **/visualised-amd64.deb
            **/Visualised-x86_64.AppImage
            **/Visualised.msix
