// Visualised for Android: runs apps drawn in Visualised, and lets them use the phone.
// Plain Java on the Android framework, and one library: ZXing's core, to read QR codes (a phone's own web view can't).
// The push template (flavour "push") adds Firebase Messaging, and only that template.
plugins {
    id "com.android.application"
}

android {
    namespace "io.visualised.app"
    compileSdk 34

    defaultConfig {
        applicationId "io.visualised.app"
        minSdk 29               // Android 10: a photo can be saved without asking for the whole of the phone's storage
        targetSdk 34
        versionCode 19
        versionName "0.9.5"
    }

    // The release is signed with the key that is yours alone: every update must be signed with the same one, so
    // it lives outside the project (never in git) with its password beside it. Elsewhere: VISUALISED_KEYSTORE and
    // VISUALISED_KEYSTORE_PASSWORD. With no key, assembleRelease makes an unsigned APK and says so.
    def home = System.getProperty("user.home")
    def keyFile = file(System.getenv("VISUALISED_KEYSTORE") ?: "${home}/visualised-release.jks")
    def passFile = file("${home}/visualised-release.pass")
    def keyPass = System.getenv("VISUALISED_KEYSTORE_PASSWORD") ?: (passFile.exists() ? passFile.text.trim() : null)
    def signed = keyFile.exists() && keyPass

    signingConfigs {
        if (signed) {
            release {
                storeFile keyFile
                storePassword keyPass
                keyAlias "visualised"
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            // R8 trims the libraries (Firebase in the push template brings far more than a push needs). Visualised's
            // own classes are kept whole and nothing is renamed: see keep.pro.
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "keep.pro"
            if (signed) {
                signingConfig signingConfigs.release
            } else {
                logger.warn("Visualised: no signing key at ${keyFile}: the release APK will be unsigned and won't install.")
            }
        }
    }

    // Two templates from one source: "plain" is Visualised itself, and what every exported app is made from unless its
    // scripts use OnPush; "push" adds Firebase Cloud Messaging (src/push) for those that do. Kept apart so the
    // Visualised app and ordinary exports stay small and carry nothing of Google's.
    flavorDimensions = ["kind"]
    productFlavors {
        plain { dimension "kind" }
        push { dimension "kind" }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        // the libraries' own Java metadata (JSch and Bouncy Castle both carry it), of no use on a phone
        resources { excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF", "META-INF/versions/**/OSGI-INF/**", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA", "org/bouncycastle/**"] }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.3"      // reads QR codes; plain Java, nothing else comes with it
    implementation "com.github.mwiede:jsch:0.2.20"    // SFTP, for SshMount's drives in the Files app (plain Java)
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"   // only its Ed25519/X25519, which a phone's Java lacks (R8 keeps just those)
    pushImplementation "com.google.firebase:firebase-messaging:24.1.0"   // the push template only
}
