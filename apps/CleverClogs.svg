<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Clever Clogs: a pair of wooden clogs walking this way, leaning in, a map pin painted on the front one's side -->
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="woodBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6B93B"/><stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C3A0E"/><stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <path id="clog" d="M5 56 C4 51 8 49 12 51 C24 57 44 52 61 37 L104 37 C110 37 113 42 112 48 L108 88 C107 95 102 99 95 99 L40 99 C22 99 9 80 5 56 Z"/>
    <path id="mouth" d="M61 37 C72 46 98 47 107 38 C100 31 69 31 61 37 Z"/>
  </defs>
  <g transform="translate(128 0) scale(-1 1)">   <!-- (turned round: coming towards you) -->
  <ellipse cx="64" cy="114" rx="58" ry="6.5" fill="#000" opacity="0.13"/>
  <!-- the one behind, further over -->
  <g transform="translate(74 62) rotate(-16) scale(0.84) translate(-58 -68)">
    <use href="#clog" fill="url(#woodBack)" stroke="#9A4D0C" stroke-width="3.6" stroke-linejoin="round"/>
    <use href="#mouth" fill="url(#inside)" stroke="#9A4D0C" stroke-width="3" stroke-linejoin="round"/>
    <path d="M22 89 C40 94 84 94 109 88" fill="none" stroke="#B45309" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- the one in front, leaning in, with the pin -->
  <g transform="translate(56 82) rotate(-7) scale(0.9) translate(-58 -68)">
    <use href="#clog" fill="url(#wood)" stroke="#9A4D0C" stroke-width="3.4" stroke-linejoin="round"/>
    <use href="#mouth" fill="url(#inside)" stroke="#9A4D0C" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M22 89 C40 94 84 94 109 88" fill="none" stroke="#B45309" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>
    <path d="M14 58 C26 61 38 58 50 50" fill="none" stroke="#FFF7D6" stroke-width="3.4" stroke-linecap="round" opacity="0.8"/>
    <path d="M66 50 C56 50 49.5 57 49.5 66 C49.5 78 66 90 66 90 C66 90 82.5 78 82.5 66 C82.5 57 76 50 66 50 Z" fill="#DC2626" stroke="#fff" stroke-width="2.8"/>
    <circle cx="66" cy="65.5" r="6" fill="#fff"/>
  </g>
  </g>
</svg>
