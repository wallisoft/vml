    <path d="M29 72 C46 80 82 80 99 72 L99.5 82 C84 91 44 91 29 82 Z" fill="url(#band)" stroke="#5A321A" stroke-width="1.6"/>
    <circle cx="44" cy="80" r="1.6" fill="#5A321A"/>
