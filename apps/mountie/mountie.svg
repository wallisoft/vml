    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6FAA42"/><stop offset="1" stop-color="#3F7A24"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A2643A"/><stop offset="1" stop-color="#7A4524"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(0.9) rotate(-24) translate(-64 -62)">
    <ellipse cx="64" cy="86" rx="61" ry="21" fill="url(#brim)" stroke="#3A6B20" stroke-width="2"/>
    <ellipse cx="58" cy="82" rx="44" ry="12" fill="#86BD57" opacity="0.45"/>
