<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia — my board</title>
<link rel="icon" href="mia.svg">
<style>
  :root{--bg:#0b1312;--tile:#16211f;--tile2:#1c2b29;--fg:#eef4f3;--muted:#9bb0ae;
        --line:#26403d;--accent:#2dd4bf;--accentfg:#06201d;--warm:#f0a06a;
        --font:system-ui,-apple-system,"Segoe UI",Ubuntu,sans-serif}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
       -webkit-user-select:none;user-select:none;touch-action:manipulation}
  .app{height:100%;display:flex;flex-direction:column;
       padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));gap:8px}
  .banner{background:var(--accent);color:var(--accentfg);border-radius:16px;min-height:10vh;
          display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 16px;font-weight:800;
          font-size:clamp(20px,5vw,38px);line-height:1.1}
  .smart{flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;min-height:11vh}
  .smart .tile{border-color:var(--accent)}
  .smart .tile .emoji{font-size:clamp(26px,6vw,46px)}
  .smart .tile .label{font-size:clamp(14px,3.4vw,22px)}
  .board{flex:1;display:grid;gap:8px;min-height:0}
  .target{position:relative;overflow:hidden;cursor:pointer}
  .target.hot{border-color:var(--accent);background:var(--tile2);box-shadow:0 0 0 3px rgba(45,212,191,.3)}
  .target.fire{background:var(--accent);color:var(--accentfg);border-color:var(--accent)}
  .target .fill{position:absolute;left:0;bottom:0;height:0;width:100%;background:rgba(45,212,191,.22);pointer-events:none}
  .tile{background:var(--tile);border:3px solid var(--line);border-radius:18px;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:3px;padding:6px;position:relative}
  .tile .emoji{font-size:clamp(28px,7vw,54px);line-height:1}
  .tile .label{font-size:clamp(15px,3.6vw,26px);font-weight:800;text-align:center;line-height:1.05}
  .tile .del{position:absolute;top:3px;right:6px;font-size:20px;color:var(--warm);display:none}
  body.editing .tile .del{display:block}
  body.editing .tile{border-style:dashed}
  .barrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:0 0 auto}
  .setbar{border:3px solid var(--line);background:var(--tile);color:var(--fg);border-radius:14px;
          min-height:8vh;display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(15px,3.2vw,22px);font-weight:800}
  .setbar.on{border-color:var(--accent);color:var(--accent)}
  .cursor{position:fixed;width:38px;height:38px;border-radius:50%;background:rgba(45,212,191,.4);
          border:4px solid var(--accent);transform:translate(-50%,-50%);pointer-events:none;z-index:90;display:none}
  #cam{position:fixed;right:10px;bottom:14px;width:104px;height:78px;border-radius:10px;object-fit:cover;
       transform:scaleX(-1);opacity:.9;z-index:30;border:2px solid var(--line);display:none}
  .sheet{position:fixed;inset:0;background:rgba(11,19,18,.97);z-index:70;display:flex;flex-direction:column;
         padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:8px;overflow:auto}
  .sheet h2{margin:2px 0;font-size:20px;text-align:center}
  .seclabel{font-size:14px;color:var(--muted);font-weight:700;margin-top:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .sbtn{border:3px solid var(--line);background:var(--tile);color:var(--fg);border-radius:14px;
        padding:14px 10px;font-size:clamp(15px,3.3vw,20px);font-weight:800;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:4px;min-height:60px;text-align:center;line-height:1.05}
  .sbtn .ic{font-size:1.5em;line-height:1}
  .sbtn.sel{border-color:var(--accent);background:var(--tile2);color:var(--accent)}
  /* the built-in on-screen keyboard (head-selectable) */
  .epword{flex:0 0 auto;min-height:9vh;background:var(--accent);color:var(--accentfg);border-radius:14px;
          display:flex;align-items:center;justify-content:center;gap:12px;font-size:clamp(22px,6vw,40px);font-weight:800;padding:6px 14px;text-align:center}
  .epword .em{font-size:1.25em}
  .eprow{flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .eprow .ek{background:var(--tile);border:3px solid var(--line);border-radius:12px;min-height:6.5vh;
             display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5.5vw,34px)}
  .eprow .ek.sel{border-color:var(--accent);background:var(--tile2)}
  .epkeys{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
  .eprowk{flex:1;display:flex;gap:6px;justify-content:center}
  .ek2{flex:1;background:var(--tile);border:3px solid var(--line);border-radius:12px;
       display:flex;align-items:center;justify-content:center;font-size:clamp(20px,5vw,32px);font-weight:800;position:relative;overflow:hidden}
  .ek2.wide{flex:2.6}
  .ek2 .fill{position:absolute;left:0;bottom:0;height:0;width:100%;background:rgba(45,212,191,.22);pointer-events:none}
  .note{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
        background:rgba(11,19,18,.94);z-index:95;font-size:18px;line-height:1.5}
  .note b{color:var(--accent)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="banner" id="banner">Mia</div>
  <div class="smart" id="smart"></div>
  <div class="board" id="board"></div>
  <div class="barrow">
    <button class="setbar target" id="addBtn"><span>&#10133;</span> Add word</button>
    <button class="setbar target" id="editBtn"><span>&#9998;</span> Edit</button>
    <button class="setbar target" id="openBtn"><span>&#9881;</span> Settings</button>
  </div>
</div>
<div class="cursor" id="cursor"></div>
<video id="cam" playsinline muted></video>

<div class="sheet" id="settings" hidden>
  <h2>Settings</h2>
  <div class="seclabel">How do you want to choose?</div>
  <div class="grid4">
    <button class="sbtn opt" data-mode="dwell"><span class="ic">&#128064;</span>Rest</button>
    <button class="sbtn opt" data-mode="blink"><span class="ic">&#128528;</span>Blink</button>
    <button class="sbtn opt" data-mode="mouth"><span class="ic">&#128558;</span>Mouth</button>
    <button class="sbtn opt" data-mode="sound"><span class="ic">&#128266;</span>Sound</button>
  </div>
  <div class="seclabel">Pointer speed <span id="gainV"></span></div>
  <div class="grid2">
    <button class="sbtn" id="gainDown">&#10094; Slower</button>
    <button class="sbtn" id="gainUp">Faster &#10095;</button>
  </div>
  <div class="seclabel">How easily it chooses <span id="tsensV"></span></div>
  <div class="grid2">
    <button class="sbtn" id="tDown">&#10094; Gentler</button>
    <button class="sbtn" id="tUp">Quicker &#10095;</button>
  </div>
  <div class="grid2">
    <button class="sbtn" id="camBtn"><span class="ic">&#128247;</span><span class="t">Start camera</span></button>
    <button class="sbtn" id="recenter"><span class="ic">&#127919;</span>Re-centre</button>
  </div>
  <div class="grid2">
    <button class="sbtn" id="resetLearn"><span class="ic">&#129504;</span>Forget learning</button>
    <button class="sbtn" id="doneBtn"><span class="ic">&#10003;</span>Back to board</button>
  </div>
  <div class="seclabel" style="text-align:center">The board learns the words used most and what tends to come next, and keeps them in the top row. Nothing leaves this device.</div>
</div>

<!-- Add / Edit a word, with the built-in keyboard (works by head or by touch) -->
<div class="sheet" id="editpanel" hidden>
  <div class="epword" id="epword"></div>
  <div class="eprow" id="epemoji"></div>
  <div class="epkeys" id="epkeys"></div>
  <div class="grid2">
    <button class="sbtn target" id="epcancel"><span class="ic">&#10005;</span>Cancel</button>
    <button class="sbtn sel target" id="epsave"><span class="ic">&#10003;</span>Save word</button>
  </div>
</div>

<div class="note" id="note"><div>Loading the face tracker</div></div>

<script type="module">
const DEFAULT_BOARD = [
  {e:"\u{1F44D}",l:"Yes",s:"Yes"},{e:"\u{1F44E}",l:"No",s:"No"},
  {e:"\u{1F64F}",l:"Please",s:"Please"},{e:"\u{1F917}",l:"Thank you",s:"Thank you"},
  {e:"\u{1F198}",l:"Help",s:"Help please"},{e:"\u{1F6BD}",l:"Toilet",s:"I need the toilet"},
  {e:"\u{1F964}",l:"Drink",s:"I'm thirsty"},{e:"\u{1F37D}\u{FE0F}",l:"Food",s:"I'm hungry"},
  {e:"\u{1F915}",l:"Pain",s:"I'm in pain"},{e:"\u{1F610}",l:"More",s:"More"},
  {e:"\u{270B}",l:"Stop",s:"Stop"},{e:"\u{1F634}",l:"Tired",s:"I'm tired"},
  {e:"\u{1F600}",l:"Good",s:"I feel good"},{e:"\u{1F61F}",l:"Not good",s:"I don't feel good"},
  {e:"\u{2764}\u{FE0F}",l:"Love you",s:"I love you"},{e:"\u{1F44B}",l:"Bye",s:"Goodbye"},
];
const EMOJIS = ["\u{1F5E8}\u{FE0F}","\u{1F44D}","\u{1F44E}","\u{1F64F}","\u{1F917}","\u{1F198}",
  "\u{1F6BD}","\u{1F964}","\u{1F37D}\u{FE0F}","\u{1F915}","\u{2764}\u{FE0F}","\u{1F600}",
  "\u{1F61F}","\u{1F48A}","\u{1F6CF}\u{FE0F}","\u{1F4FA}","\u{1F3B5}","\u{260E}\u{FE0F}"];

function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let board = load("mia.board", DEFAULT_BOARD);
let freq  = load("mia.freq", {});
let after = load("mia.after", {});
let last  = null;
// tracker + interaction state up top, so functions called during setup can touch it (no dead-zone)
let FaceLandmarker,FilesetResolver,landmarker=null,tracking=false;
let centre={x:0.5,y:0.42}, cur={x:0.5,y:0.5}, pendingRecentre=false;
let blinkStart=0, blinkFired=false;
let audioCtx=null,analyser=null,audioBuf=null,micReady=false,soundBase=0.12,soundArmed=true;
let hoverEl=null,hoverStart=0,cooldownUntil=0;

const FIRE_COOLDOWN=750; let mode="dwell", gainVal=3.5, tVal=50;
try{ const g=+localStorage.getItem("mia.gain"); if(!isNaN(g)&&g) gainVal=g;
     const t=+localStorage.getItem("mia.tsens"); if(!isNaN(t)) tVal=t;
     const m=localStorage.getItem("mia.mode"); if(m) mode=m; }catch(e){}
function persistPrefs(){ try{ localStorage.setItem("mia.gain",gainVal); localStorage.setItem("mia.tsens",tVal); localStorage.setItem("mia.mode",mode);}catch(e){} }

const boardEl=document.getElementById("board"), smartEl=document.getElementById("smart"),
      banner=document.getElementById("banner"), cursor=document.getElementById("cursor"),
      cam=document.getElementById("cam"), note=document.getElementById("note"),
      settings=document.getElementById("settings"), openBtn=document.getElementById("openBtn"),
      addBtn=document.getElementById("addBtn"), editBtn=document.getElementById("editBtn"),
      camBtn=document.getElementById("camBtn"), recenterBtn=document.getElementById("recenter"),
      doneBtn=document.getElementById("doneBtn"), resetLearn=document.getElementById("resetLearn"),
      gainUp=document.getElementById("gainUp"), gainDown=document.getElementById("gainDown"),
      tUp=document.getElementById("tUp"), tDown=document.getElementById("tDown"),
      gainV=document.getElementById("gainV"), tsensV=document.getElementById("tsensV"),
      editpanel=document.getElementById("editpanel"), epword=document.getElementById("epword"),
      epemoji=document.getElementById("epemoji"), epkeys=document.getElementById("epkeys"),
      epcancel=document.getElementById("epcancel"), epsave=document.getElementById("epsave");
let camLbl=camBtn.querySelector(".t");

function cols(n){ return n<=9?3:n<=16?4:5; }
function ensureFill(el){ if(!el.querySelector(".fill")){ const f=document.createElement("span"); f.className="fill"; el.appendChild(f);} }
function flash(el){ el.classList.add("fire"); setTimeout(()=>el.classList.remove("fire"),280); }
function bindTarget(el,action){ el.classList.add("target"); ensureFill(el); el._action=action;
  el.addEventListener("click",(ev)=>{ if(ev) ev.stopPropagation(); el._action(); flash(el); }); }

function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=1; speechSynthesis.speak(u);}catch(e){} }
function say(tile){
  banner.textContent=tile.s; speak(tile.s);
  freq[tile.l]=(freq[tile.l]||0)+1;
  if(last){ (after[last]=after[last]||{}); after[last][tile.l]=(after[last][tile.l]||0)+1; }
  last=tile.l; save("mia.freq",freq); save("mia.after",after);
  renderSmart();
}

function tileNode(tile,small){
  const el=document.createElement("div"); el.className="tile";
  el.innerHTML=`<div class="emoji">${tile.e||"\u{1F5E8}\u{FE0F}"}</div><div class="label">${tile.l}</div>`;
  if(!small){ const d=document.createElement("div"); d.className="del"; d.textContent="✕";
    d.addEventListener("click",(ev)=>{ ev.stopPropagation(); if(confirm("Remove “"+tile.l+"”?")){ board=board.filter(t=>t!==tile); save("mia.board",board); renderBoard(); renderSmart(); } });
    el.appendChild(d); }
  bindTarget(el, ()=>{ if(document.body.classList.contains("editing")&&!small){ openEdit(tile); } else { say(tile); } });
  return el;
}
function renderBoard(){
  boardEl.style.gridTemplateColumns=`repeat(${cols(board.length)},1fr)`;
  boardEl.innerHTML=""; for(const t of board) boardEl.appendChild(tileNode(t,false));
}
function renderSmart(){
  let picks=[];
  if(last && after[last]){ picks=Object.entries(after[last]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]); }
  if(picks.length<4){ const by=Object.entries(freq).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    for(const l of by){ if(!picks.includes(l)) picks.push(l); if(picks.length>=4) break; } }
  picks=picks.slice(0,4).map(l=>board.find(t=>t.l===l)).filter(Boolean);
  smartEl.innerHTML="";
  if(!picks.length){ smartEl.style.display="none"; return; }
  smartEl.style.display="grid";
  for(const t of picks) smartEl.appendChild(tileNode(t,true));
}
function activeTargets(){
  if(!editpanel.hidden) return [...epemoji.children, ...epkeys.querySelectorAll(".ek2"), epcancel, epsave];
  if(settings.hidden) return [...smartEl.children, ...boardEl.children, addBtn, editBtn, openBtn];
  return Array.from(settings.querySelectorAll(".sbtn")).filter(b=>b.offsetParent!==null);
}

// ---- the on-screen keyboard: add / edit a word by head or touch ----
let epBuf="", epEmoji="", epTarget=null;
function paintEmoji(){ for(const k of epemoji.children) k.classList.toggle("sel", k.dataset.e===epEmoji); }
function paintWord(){ epword.innerHTML=`<span class="em">${epEmoji||"\u{1F5E8}\u{FE0F}"}</span><span>${epBuf||"look / type a word…"}</span>`; }
function buildOSK(){
  epemoji.innerHTML="";
  for(const e of EMOJIS){ const k=document.createElement("div"); k.className="ek"; k.dataset.e=e; k.textContent=e;
    bindTarget(k, ()=>{ epEmoji=e; paintEmoji(); paintWord(); }); epemoji.appendChild(k); }
  epkeys.innerHTML="";
  for(const r of ["qwertyuiop","asdfghjkl","zxcvbnm"]){
    const rd=document.createElement("div"); rd.className="eprowk";
    for(const ch of r){ const k=document.createElement("div"); k.className="ek2"; k.textContent=ch;
      bindTarget(k, ()=>{ epBuf+=ch; paintWord(); }); rd.appendChild(k); }
    epkeys.appendChild(rd);
  }
  const rd=document.createElement("div"); rd.className="eprowk";
  const sp=document.createElement("div"); sp.className="ek2 wide"; sp.textContent="space"; bindTarget(sp,()=>{ epBuf+=" "; paintWord(); });
  const bk=document.createElement("div"); bk.className="ek2"; bk.textContent="⌫"; bindTarget(bk,()=>{ epBuf=epBuf.slice(0,-1); paintWord(); });
  rd.appendChild(sp); rd.appendChild(bk); epkeys.appendChild(rd);
}
function openEdit(tile){
  epTarget=tile||null; epBuf=tile?tile.l:""; epEmoji=tile?(tile.e||""):"";
  paintEmoji(); paintWord(); settings.hidden=true; editpanel.hidden=false; clearHover();
}
function saveEdit(){
  const w=epBuf.trim();
  if(w){ const e=epEmoji||"\u{1F5E8}\u{FE0F}";
    if(epTarget){ epTarget.l=w; epTarget.s=w; epTarget.e=e; } else { board.push({e,l:w,s:w}); }
    save("mia.board",board); renderBoard(); renderSmart(); }
  editpanel.hidden=true; clearHover(); banner.textContent="Mia";
}

function openSettings(){ gainV.textContent=gainVal.toFixed(1); tsensV.textContent=tVal+"%"; settings.hidden=false; clearHover(); }
function closeSettings(){ settings.hidden=true; clearHover(); banner.textContent=tracking?"Look at a tile":"Mia"; }
function setMode(m){ mode=m; for(const b of settings.querySelectorAll(".opt")) b.classList.toggle("sel",b.dataset.mode===m); blinkStart=0; blinkFired=false; soundArmed=true; persistPrefs(); if(m==="sound"&&tracking) calibrate(); }
function stepGain(d){ gainVal=Math.min(10.5,Math.max(1.5,+(gainVal+d).toFixed(1))); gainV.textContent=gainVal.toFixed(1); persistPrefs(); }
function stepT(d){ tVal=Math.min(100,Math.max(0,tVal+d)); tsensV.textContent=tVal+"%"; persistPrefs(); }

bindTarget(openBtn, openSettings);
bindTarget(addBtn, ()=>openEdit(null));
bindTarget(editBtn, ()=>{ document.body.classList.toggle("editing"); editBtn.classList.toggle("on"); banner.textContent=document.body.classList.contains("editing")?"Edit: tap a tile to change, ✕ to remove":"Mia"; });
bindTarget(doneBtn, closeSettings);
bindTarget(recenterBtn, ()=>{ pendingRecentre=true; });
bindTarget(resetLearn, ()=>{ if(confirm("Forget the learned words and order?")){ freq={}; after={}; last=null; save("mia.freq",freq); save("mia.after",after); renderSmart(); } });
bindTarget(gainUp, ()=>stepGain(+0.5)); bindTarget(gainDown, ()=>stepGain(-0.5));
bindTarget(tUp, ()=>stepT(+10)); bindTarget(tDown, ()=>stepT(-10));
for(const b of settings.querySelectorAll(".opt")) bindTarget(b, ()=>setMode(b.dataset.mode));
bindTarget(camBtn, ()=>{ if(tracking) stopCamera(); else startCamera(); });
bindTarget(epcancel, ()=>{ editpanel.hidden=true; clearHover(); banner.textContent="Mia"; });
bindTarget(epsave, saveEdit);
banner.addEventListener("click",openSettings);
buildOSK(); renderBoard(); renderSmart(); setMode(mode);

// ================= the tracker (same engine as the talker) =================
function clearHover(){ if(hoverEl){ hoverEl.classList.remove("hot"); const f=hoverEl.querySelector(".fill"); if(f)f.style.height="0"; } hoverEl=null; }
function setHover(px,py){ let over=null;
  for(const el of activeTargets()){ const r=el.getBoundingClientRect();
    if(px>=r.left&&px<=r.right&&py>=r.top&&py<=r.bottom){ over=el; break; } }
  if(over!==hoverEl){ if(hoverEl){ hoverEl.classList.remove("hot"); const f=hoverEl.querySelector(".fill"); if(f)f.style.height="0"; }
    hoverEl=over; hoverStart=performance.now(); if(hoverEl) hoverEl.classList.add("hot"); } }
function gazeFire(el){ if(!el||performance.now()<cooldownUntil) return; cooldownUntil=performance.now()+FIRE_COOLDOWN; el._action(); flash(el); }
function lerp(a,b,t){ return a+(b-a)*t; }
function blendMap(res){ const m={}; if(res.faceBlendshapes&&res.faceBlendshapes[0]) for(const c of res.faceBlendshapes[0].categories) m[c.categoryName]=c.score; return m; }

async function makeLandmarker(fs,delegate){ return await FaceLandmarker.createFromOptions(fs,{
  baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate},
  runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true}); }
try{
  ({FaceLandmarker,FilesetResolver}=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"));
  const fs=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  try{ landmarker=await makeLandmarker(fs,"GPU"); }catch(e){ landmarker=await makeLandmarker(fs,"CPU"); }
  note.hidden=true; openSettings();
}catch(e){ note.innerHTML="<div>Couldn't load the face tracker. You can still <b>tap</b> the tiles.</div>"; }

async function setupAudio(){ if(micReady) return true;
  try{ const s=await navigator.mediaDevices.getUserMedia({audio:true});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)(); try{await audioCtx.resume();}catch(e){}
    const src=audioCtx.createMediaStreamSource(s); analyser=audioCtx.createAnalyser(); analyser.fftSize=1024;
    audioBuf=new Uint8Array(analyser.fftSize); src.connect(analyser); micReady=true; return true; }catch(e){ return false; } }
function micRMS(){ if(!analyser) return 0; analyser.getByteTimeDomainData(audioBuf);
  let s=0; for(let i=0;i<audioBuf.length;i++){ const x=(audioBuf[i]-128)/128; s+=x*x; } return Math.sqrt(s/audioBuf.length); }
async function calibrate(){ if(!(await setupAudio())) return; banner.textContent="Stay quiet a moment";
  let peak=0; const t0=performance.now();
  await new Promise(r=>{ const tick=()=>{ peak=Math.max(peak,micRMS()); if(performance.now()-t0<1500) requestAnimationFrame(tick); else r(); }; tick(); });
  soundBase=peak*3+0.03; banner.textContent="Now make your sound to choose"; }

let camStream=null;
function stopCamera(){ tracking=false; try{localStorage.setItem("mia.cam","0");}catch(e){}
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  cam.style.display="none"; cursor.style.display="none"; if(camLbl) camLbl.textContent="Start camera"; banner.textContent="Mia"; }
async function startCamera(){
  try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},audio:false});
    cam.srcObject=camStream; await cam.play(); cam.style.display="block"; cursor.style.display="block";
    if(camLbl) camLbl.textContent="Stop camera"; tracking=true; try{localStorage.setItem("mia.cam","1");}catch(e){}
    banner.textContent="Look at a tile"; if(mode==="sound") calibrate(); closeSettings(); requestAnimationFrame(loop);
  }catch(e){ note.hidden=false; note.innerHTML="<div>The camera was blocked. Allow camera access and reload, or just <b>tap</b> the tiles.</div>"; } }

let lastTick=0;
function loop(){
  if(!tracking) return; lastTick=performance.now(); const t=tVal/100;
  try{
    if(landmarker && cam.readyState>=2 && cam.videoWidth>0){
      const res=landmarker.detectForVideo(cam,performance.now());
      const n=(res&&res.faceLandmarks)?res.faceLandmarks.length:0;
      if(n>0){
        const nose=res.faceLandmarks[0][1]; const nx=1-nose.x, ny=nose.y;
        if(pendingRecentre){ centre={x:nx,y:ny}; pendingRecentre=false; }
        let tx=Math.min(1,Math.max(0,0.5+(nx-centre.x)*gainVal));
        let ty=Math.min(1,Math.max(0,0.5+(ny-centre.y)*gainVal));
        cur.x+=(tx-cur.x)*0.35; cur.y+=(ty-cur.y)*0.35;
        const px=cur.x*innerWidth, py=cur.y*innerHeight;
        cursor.style.left=px+"px"; cursor.style.top=py+"px"; setHover(px,py);
        if(mode==="dwell"){ const dwellMs=lerp(2200,700,t);
          if(hoverEl){ const held=performance.now()-hoverStart; const f=hoverEl.querySelector(".fill"); if(f) f.style.height=Math.min(100,held/dwellMs*100)+"%";
            if(held>=dwellMs){ const el=hoverEl; if(f)f.style.height="0"; gazeFire(el); hoverStart=performance.now()+500; } } }
        else if(mode==="blink"){ const bth=lerp(0.72,0.42,t),bhold=lerp(600,220,t); const bs=blendMap(res);
          const b=Math.min(bs.eyeBlinkLeft||0,bs.eyeBlinkRight||0);
          if(b>bth){ if(!blinkStart) blinkStart=performance.now(); else if(!blinkFired&&performance.now()-blinkStart>=bhold&&hoverEl){ gazeFire(hoverEl); blinkFired=true; } }
          else if(b<bth*0.55){ blinkStart=0; blinkFired=false; } }
        else if(mode==="mouth"){ const mth=lerp(0.68,0.38,t),mhold=lerp(500,180,t); const bs=blendMap(res); const m=bs.jawOpen||0;
          if(m>mth){ if(!blinkStart) blinkStart=performance.now(); else if(!blinkFired&&performance.now()-blinkStart>=mhold&&hoverEl){ gazeFire(hoverEl); blinkFired=true; } }
          else if(m<mth*0.5){ blinkStart=0; blinkFired=false; } }
      }
    }
    if(mode==="sound"){ if(audioCtx&&audioCtx.state==="suspended"){ try{audioCtx.resume();}catch(e){} }
      const thr=Math.min(0.6,Math.max(0.04,soundBase*lerp(1.9,0.7,t))); const r=micReady?micRMS():0;
      if(micReady&&!speechSynthesis.speaking){ if(r>thr&&soundArmed&&hoverEl){ gazeFire(hoverEl); soundArmed=false; } else if(r<thr*0.6){ soundArmed=true; } } }
  }catch(e){}
  requestAnimationFrame(loop);
}
function resume(){ if(!tracking) return; try{cam.play();}catch(e){} if(audioCtx){try{audioCtx.resume();}catch(e){}} if(performance.now()-lastTick>400) requestAnimationFrame(loop); }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) resume(); });
window.addEventListener("focus",resume); window.addEventListener("pageshow",resume);
</script>
</body>
